<style>
/* Layout: late-night game-show stage. The wheel is the hero on the left, the spinner's desk on the right; players, rules and log sit below. Stacks on phones. Single committed dark look. */
:root{
  --bg:#0e0a22; --bg2:#151036; --panel:#1b1544; --panel2:#231b55; --line:#30287a;
  --fg:#f5f1ff; --muted:#a9a1d8; --gold:#ffc83a; --pink:#ff3d8b; --cyan:#2ad4ff;
  --green:#3fe08f; --red:#ff4b5c; --blue:#2f7bff; --purple:#9a55ff; --ink:#120c33;
  --display:"Bungee",Impact,"Arial Black",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  background:radial-gradient(ellipse 80% 50% at 50% -5%,#2c1b72 0%,transparent 70%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-right:auto;min-width:0}
.logo{font-family:var(--display);font-size:clamp(28px,5vw,44px);line-height:1;letter-spacing:.01em;
  background:linear-gradient(90deg,var(--gold),var(--pink) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:var(--cond);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-size:14px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.jp{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#000;border:2px solid var(--gold);font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--gold)}
.jp b{font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--gold);color:var(--ink);font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;transition:transform .12s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.08)} .btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--panel2)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.wide{width:100%}
.btn.pink{background:var(--pink);color:#fff}
.btn.cyan{background:var(--cyan);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:880px){.stage{grid-template-columns:minmax(0,1fr)}}
.wheelcol{display:flex;flex-direction:column;gap:18px;align-items:center;min-width:0}
.topslot{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-radius:999px;background:#000;border:2px solid var(--gold);box-shadow:0 0 24px rgba(255,200,58,.25)}
.topslot .lbl{font-family:var(--display);font-size:15px;color:var(--gold);letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-family:var(--cond);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.topslot .mult{font-family:var(--display);font-size:20px;color:#000;background:var(--gold);border-radius:999px;padding:2px 12px}
.wheelbox{position:relative;width:min(100%,560px);aspect-ratio:1;max-width:100%}
.wheelbox canvas{width:100%;height:100%;display:block;border-radius:50%;
  box-shadow:0 0 0 5px #2a2168,0 0 0 9px var(--gold),0 0 70px rgba(255,61,139,.35),0 0 140px rgba(42,212,255,.15)}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:38px solid var(--gold);filter:drop-shadow(0 4px 4px rgba(0,0,0,.6));z-index:2}
.hub{position:absolute;inset:37%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d2f96,#120c33 70%);border:4px solid var(--gold);display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:clamp(12px,2.6vw,21px);line-height:1.05;color:var(--gold);box-shadow:inset 0 0 22px rgba(0,0,0,.7),0 0 0 3px rgba(0,0,0,.4);pointer-events:none}

/* desk */
.desk{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.spinner-name{font-family:var(--display);font-size:clamp(28px,4.4vw,40px);line-height:1.05;color:var(--fg);word-break:break-word}
.bet{display:flex;align-items:center;gap:10px}
.bet b{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;min-width:1.6ch;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.bet span{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);font-size:24px;line-height:1;display:grid;place-items:center}
.rbtn:hover:not(:disabled){background:var(--panel2)} .rbtn:disabled{opacity:.35;cursor:not-allowed}
.btn.spin{font-family:var(--display);font-weight:400;font-size:22px;padding:18px;border-radius:14px;background:linear-gradient(90deg,var(--gold),#ffb020);box-shadow:0 6px 0 #a36a00,0 10px 30px rgba(255,200,58,.25)}
.btn.spin:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #a36a00}
.desk-top{display:flex;flex-direction:column;gap:16px}
details.odds{border-top:1px solid var(--line);padding-top:12px}
details.odds summary{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);cursor:pointer}
.oddsgrid{display:flex;flex-direction:column;gap:12px;margin-top:12px;max-height:420px;overflow:auto;padding-right:4px}
.oddsgrid h4{margin:0;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--gold)}
.orow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;font-size:14px}
.orow .sw{width:12px;height:12px;border-radius:3px;align-self:center}
.orow .pct{font-variant-numeric:tabular-nums;font-weight:700}
.orow .d{grid-column:2/4;color:var(--muted);font-size:13px;line-height:1.35}

/* players */
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sect-h h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.02em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,200,58,.2)}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc-top b{font-size:17px;overflow-wrap:anywhere}
.plus{border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:3px 8px;font-family:var(--cond);font-weight:700;font-size:14px;flex:none}
.plus:hover{background:var(--pink);border-color:var(--pink)}
.pc-stats{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.pc-stats b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums;margin-right:3px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.badge.ace{background:#000;color:var(--gold);border-color:var(--gold)}
.badge.buddy{color:var(--cyan);border-color:var(--cyan)}
.badge.accent{color:var(--pink);border-color:var(--pink)}
.badge.water{color:var(--green);border-color:var(--green)}
.badge.master{color:var(--fg);border-color:var(--muted)}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.lower{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.rules{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.rules li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;background:var(--bg2);border-radius:10px}
.rules li span{overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.x:hover{color:var(--red)}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;font-size:14px}
.loglist li{padding:4px 0;border-bottom:1px solid rgba(48,40,122,.6);overflow-wrap:anywhere}
.loglist time{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:8px;font-size:12px}
.empty{color:var(--muted);font-size:14px;margin:0}

/* setup */
.setup{max-width:620px;margin:10px auto 0;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px}
.setup h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.prow{display:flex;gap:8px}
.inp{width:100%;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:inherit}
.inp::placeholder{color:#6f67a3}
.setgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.setgrid{grid-template-columns:minmax(0,1fr)}}
.lbl{display:block;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);margin-bottom:6px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,4,18,.82);backdrop-filter:blur(4px);overflow:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{max-width:580px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.m-head{background:var(--c);color:var(--cf);padding:18px 20px;display:flex;flex-direction:column;gap:4px;position:relative}
.m-head .m-kind{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:13px;opacity:.85}
.m-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,34px);line-height:1.05;text-wrap:balance}
.ts-hit{align-self:flex-start;margin-top:6px;background:#000;color:var(--gold);border:2px solid var(--gold);border-radius:999px;padding:2px 10px;font-family:var(--display);font-size:14px}
.m-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.m-foot{padding:0 20px 16px;display:flex;justify-content:flex-end}
.linkbtn{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.lead{margin:0;font-size:17px}
.lead b{color:var(--gold)}
.verdict{margin:0;font-family:var(--display);font-size:26px;text-align:center;color:var(--gold)}
.result{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:16px}
.drinks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.drinks li{background:var(--bg2);border-left:4px solid var(--pink);padding:8px 12px;border-radius:6px}
.bigline{font-family:var(--display);font-size:22px;text-align:center;margin:0;color:var(--fg)}

/* give out */
.give{display:flex;flex-direction:column;gap:12px}
.give-head{display:flex;gap:14px;align-items:center}
.big-num{font-family:var(--display);font-size:52px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.give-rows{display:flex;flex-direction:column;gap:6px}
.give-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 6px 6px 12px;background:var(--bg2);border-radius:10px}
.give-row span{overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;gap:8px;flex:none}

/* coin */
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.side{border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.side span{font-weight:700;overflow-wrap:anywhere}
.side b{font-family:var(--display);font-weight:400;font-size:30px}
.side.red{background:#4a0f22;border:2px solid var(--red)}
.side.blue{background:#0d2a52;border:2px solid var(--blue)}
.coin-wrap{perspective:600px}
.coin{position:relative;width:88px;height:88px;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:#fff;border:5px solid var(--gold)}
.f-red{background:radial-gradient(circle at 35% 30%,#ff7b8a,#b3122c)}
.f-blue{background:radial-gradient(circle at 35% 30%,#7fb0ff,#1745a8);transform:rotateY(180deg)}
.f-gold{background:radial-gradient(circle at 35% 30%,#fff1b0,#d39a00);color:var(--ink)}
.f-dark{background:radial-gradient(circle at 35% 30%,#555,#151515);transform:rotateY(180deg)}
.coin-solo{display:flex;justify-content:center}

/* cards */
.card{width:74px;height:104px;border-radius:9px;background:#fbf8ff;color:#15122b;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.45);flex:none;font-family:var(--body);font-weight:700}
.card.red{color:#d0142c}
.card .cr{position:absolute;top:5px;left:7px;font-size:16px;line-height:1}
.card .cr.br{top:auto;left:auto;bottom:5px;right:7px;transform:rotate(180deg)}
.card .cs{position:absolute;inset:0;display:grid;place-items:center;font-size:40px}
.card.back{background:repeating-linear-gradient(45deg,#2b1f7a 0 8px,#3a2c9b 8px 16px);border:4px solid #fbf8ff}
.card.flipin{animation:flipin .45s ease-out}
@keyframes flipin{from{transform:rotateY(90deg) translateY(-14px)}to{transform:none}}
.card.lg{width:96px;height:136px}.card.lg .cs{font-size:54px}.card.lg .cr{font-size:20px}
.cardrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:104px}
.deckrow{display:flex;gap:18px;align-items:center;justify-content:center}
.deck{width:74px;height:104px;border-radius:9px;background:repeating-linear-gradient(45deg,#2b1f7a 0 8px,#3a2c9b 8px 16px);border:4px solid #fbf8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:3px 3px 0 #d8d2f0,6px 6px 0 #b9b1e0}
.deck span{font-family:var(--display);font-size:24px;line-height:1;background:var(--ink);padding:2px 6px;border-radius:6px}
.deck small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);padding:1px 4px;border-radius:4px;margin-top:4px}
.promises{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prom{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}
.prom span{overflow-wrap:anywhere}
.prom.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.kh{margin:0;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.koh-reveal{display:flex;gap:18px;align-items:center;background:#3d0010;border:2px solid var(--red);border-radius:14px;padding:16px}
.koh-reveal h3{margin:2px 0 6px;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.koh-reveal .promise{margin:0 0 4px;font-size:20px;font-weight:700;color:var(--gold);overflow-wrap:anywhere}
@media (max-width:460px){.koh-reveal{flex-direction:column;text-align:center}}
.pot{display:flex;justify-content:center;align-items:baseline;gap:8px}
.pot b{font-family:var(--display);font-weight:400;font-size:44px;color:var(--gold);font-variant-numeric:tabular-nums}
.stage-q{font-family:var(--display);font-size:20px;text-align:center;margin:0}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:34px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--gold)}
.note{margin:0;padding:8px 12px;border-radius:8px;background:#3d0010;border:1px solid var(--red);font-size:14px}

/* sip hunt */
.hunt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tile{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:linear-gradient(160deg,#2a2168,#1a1446);font-family:var(--display);font-size:18px;color:var(--green);display:grid;place-items:center;padding:2px;line-height:1.05;text-align:center}
.tile:hover:not(:disabled){background:var(--green);color:var(--ink)}
.tile.rv{font-family:var(--cond);font-weight:700;font-size:clamp(10px,2.6vw,14px);cursor:default}
.tile.m{background:#103a26;color:var(--green)}
.tile.t{background:#3d0010;color:#ff9aa5}
.tile.pk{outline:3px solid var(--gold);outline-offset:1px;transform:scale(1.08);z-index:1}

/* plinko / crazy */
.pl-wrap{display:flex;justify-content:center}
.plinko{display:block;max-width:100%}
.cwheel{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto}
.cwheel canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 4px #000,0 0 0 7px var(--red),0 0 40px rgba(255,46,77,.4)}
.cwheel .pointer{border-top-color:var(--red);top:-12px;border-left-width:13px;border-right-width:13px;border-top-width:28px}
.cwheel .hub{inset:40%;font-size:12px;border-color:var(--red);color:var(--red)}

/* drag race */
.sheet.wide{max-width:920px}
.grid-cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.gc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gc b{overflow-wrap:anywhere}
.gc canvas{width:100%;height:auto;display:block;opacity:.55}
.gc-car{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted)}
.gc-odds{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gc.locked{border-color:var(--gold)}
.gc.locked canvas{opacity:1}
.gc.locked .gc-car{color:var(--fg)}
.gc.duster{border-color:#b3a07a;background:#2b2416;animation:shake .55s}
.gc.duster .gc-car{color:#d9c48f}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-1.5deg)}40%{transform:translateX(6px) rotate(1.5deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (max-width:520px){.grid-cars{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.gc{padding:6px 7px}.gc b{font-size:14px}.gc-car{font-size:12px;letter-spacing:.03em}.gc-odds{font-size:11px}}
.race-box{display:flex;flex-direction:column;gap:12px}
.race-box:empty{display:none}
.race{display:block;width:100%;border-radius:12px;background:#0b0920}
.podium{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.podium li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;background:var(--bg2);border:1px solid transparent;border-radius:8px}
.podium li.win{background:#000;border-color:var(--gold)}
.podium li.last{background:#3d0010;border-color:var(--red)}
.podium .pos{font-family:var(--display);font-size:18px;color:var(--gold);min-width:1.4em}
.podium .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}

/* glass bridge */
.gb-queue{display:flex;flex-wrap:wrap;gap:6px}
.gbq{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:14px}
.gbq i{font-style:normal;font-family:var(--display);font-size:12px;color:#10131a;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.gbq.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.gbq.fell{opacity:.55;text-decoration:line-through;border-color:var(--red)}
.gbq.done{border-color:var(--green)}
.gb{cursor:pointer}

/* the host: stands at the wheel, spins it and reacts */
.host{position:absolute;left:-5%;bottom:-3%;height:60%;aspect-ratio:200/430;z-index:3;pointer-events:none}
.host svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:hostBob 3.4s ease-in-out infinite}
.host .h-arm{transform-box:view-box;transform-origin:136px 131px}
.host.pull .h-arm{animation:hostPull .6s cubic-bezier(.3,1.5,.5,1)}
.host .e-open{transform-box:fill-box;transform-origin:center;animation:hostBlink 4.6s infinite}
.host .spark{animation:hostTwinkle 1.8s ease-in-out infinite}
.host .spark:nth-child(2n){animation-delay:.6s}
.host .spark:nth-child(3n){animation-delay:1.1s}
.host .e-happy,.host .e-wince,.host .e-wide,.host .m-open,.host .m-wavy,.host .m-o{display:none}
.host[data-mood="cheer"] .e-open,.host[data-mood="cheer"] .m-smile,.host[data-mood="wince"] .e-open,.host[data-mood="wince"] .m-smile,.host[data-mood="shock"] .e-open,.host[data-mood="shock"] .m-smile{display:none}
.host[data-mood="cheer"] .e-happy,.host[data-mood="cheer"] .m-open,.host[data-mood="wince"] .e-wince,.host[data-mood="wince"] .m-wavy,.host[data-mood="shock"] .e-wide,.host[data-mood="shock"] .m-o{display:inline}
.host[data-mood="cheer"] svg{animation:hostHop .45s ease-out 3}
@keyframes hostBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%)}}
@keyframes hostHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-5%)}}
@keyframes hostPull{0%{transform:rotate(0)}35%{transform:rotate(-36deg)}100%{transform:rotate(0)}}
@keyframes hostBlink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
@keyframes hostTwinkle{0%,100%{opacity:.15}50%{opacity:1}}

/* scoreboard */
.score{width:100%;border-collapse:collapse;font-size:15px}

.award b{display:block;font-family:var(--display);font-weight:400;font-size:18px;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:#000;border:2px solid var(--pink);color:var(--fg);padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:600}

<script>
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sips=n=>n===1?'1 sip':`${n} sips`;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- outcomes (weights sum to 100, so weight = percent) ---------- */
const KIND={house:'Miss',num:'Number',bonus:'Bonus game',mild:'Mild',medium:'Medium',brutal:'Brutal'};
const KIND_STYLE={mild:{bg:'#11a39a',fg:'#ffffff'},medium:{bg:'#e8590c',fg:'#ffffff'}};
const OUTCOMES={
  miss:{w:7,kind:'house',short:'MISS',name:'House Wins',bg:'#241d3d',fg:'#9a91cc',desc:'Nothing happens. You drank your bet for nothing.'},
  n1:{w:14,kind:'num',n:1,short:'1',bg:'#2f7bff',fg:'#ffffff'},
  n2:{w:9,kind:'num',n:2,short:'2',bg:'#ffc83a',fg:'#1a1240'},
  n5:{w:3,kind:'num',n:5,short:'5',bg:'#ff3d8b',fg:'#ffffff'},
  n10:{w:1,kind:'num',n:10,short:'10',bg:'#9a55ff',fg:'#ffffff'},
  coin:{w:6,kind:'bonus',short:'COIN FLIP',name:'Coin Flip Duel',bg:'#d9dceb',fg:'#1a1240',desc:'Duel a random player. One coin, two multipliers. The loser drinks the bet × the winning multiplier.'},
  hunt:{w:4,kind:'bonus',short:'SIP HUNT',name:'Sip Hunt',bg:'#3fe08f',fg:'#0b2a1a',desc:'Pick one of 36 hidden tiles. Most hide multipliers, some hide traps.'},
  plinko:{w:4,kind:'bonus',short:'PLINKO',name:'Plinko of Doom',bg:'#2ad4ff',fg:'#0b1f33',desc:'Drop a puck down the pegs into payouts, traps, a waterfall or a double-stakes re-drop.'},
  crazy:{w:2,kind:'bonus',short:'CRAZY',name:'Crazy Round',bg:'#ff2e4d',fg:'#ffe066',desc:'A second wheel with the biggest payouts and the nastiest punishments.'},
  drag:{w:4,kind:'bonus',short:'DRAG RACE',name:'Drag Race',bg:'#c6ff00',fg:'#141414',desc:'Everyone gets a random car for a quarter-mile race. The winner hands out sips, last place drinks, and somebody always gets the Dacia Duster.'},
  bridge:{w:4,kind:'bonus',short:'GLASS BRIDGE',name:'Glass Bridge',bg:'#0b3d3a',fg:'#7ff5e1',desc:'Everyone crosses a bridge of glass panels one at a time, picking left or right at every step. Fall and you drink. The first player across hands out sips.'},
  truth:{w:4,kind:'mild',short:'TRUTH',name:'Truth or Shot',desc:'A random player asks you anything. Answer honestly or drink 5.'},
  rule:{w:3,kind:'mild',short:'NEW RULE',name:'Make a Rule',desc:'Add a house rule that lasts the rest of the game.'},
  accent:{w:4,kind:'mild',short:'ACCENT',name:'Accent Curse',desc:'Talk in an accent until your next turn. Every slip costs a sip.'},
  thumb:{w:3,kind:'mild',short:'THUMB',name:'Thumb Master',desc:'Put your thumb on the table any time. The last one to copy you drinks.'},
  qm:{w:3,kind:'mild',short:'QUESTION',name:'Question Master',desc:'Anyone who answers a question you ask drinks. Lasts until the next Question Master.'},
  mirror:{w:3,kind:'mild',short:'MIRROR',name:'Mirror',desc:'A random player drinks exactly your bet.'},
  waterfall:{w:3,kind:'mild',short:'WATERFALL',name:'Waterfall',desc:'Everyone drinks. Nobody stops before the person before them in the order.'},
  don:{w:2,kind:'mild',short:'2× OR 0',name:'Double or Nothing',desc:'Coin flip. Heads: hand out double your bet. Tails: drink your bet again.'},
  hilo:{w:2,kind:'mild',short:'HI-LO',name:'Higher or Lower',desc:'Guess higher or lower to grow a pot. Cash out to hand it out, or guess wrong and drink it.'},
  buddy:{w:3,kind:'medium',short:'BUDDY',name:'Drinking Buddy',desc:'You and a random player are chained: when one drinks, both drink. Lasts until the next Drinking Buddy.'},
  robin:{w:2,kind:'medium',short:'ROBIN',name:'Robin Hood',desc:'Whoever drank the most hands 5 sips to whoever drank the least.'},
  bankrupt:{w:3,kind:'medium',short:'BANKRUPT',name:'Bankrupt',desc:'Drink your bet again.'},
  bus:{w:2,kind:'medium',short:'THE BUS',name:'Ride the Bus',desc:'Four card questions in a row. Get one wrong: drink and start over.'},
  ace:{w:2,kind:'medium',short:'AUCTION',name:'Ace Auction',desc:'Secret auction. The highest bidder drinks the bid and gives double for 3 rounds.'},
  koh:{w:2,kind:'brutal',short:'K ♥',name:'King of Hearts',bg:'#8b0016',fg:'#ffffff',desc:'You and a random player draw cards. Before each draw, say out loud what you will do if it is the King of Hearts.'},
  jackpot:{w:1,kind:'brutal',short:'JACKPOT',name:'Jackpot',bg:'#000000',fg:'#ffc83a',desc:'Hand out the whole jackpot. It grows by 1 sip after every full round.'},
};
const style=k=>{const o=OUTCOMES[k];const s=KIND_STYLE[o.kind]||{};return{bg:o.bg||s.bg,fg:o.fg||s.fg,label:o.short,big:o.kind==='num'}};
const oname=k=>OUTCOMES[k].name||`Number ${OUTCOMES[k].n}`;
const TOP_KEYS=['n1','n2','n5','n10','coin','hunt','plinko','crazy','drag','bridge'];

// Temporary test odds: outcome → chance in percent. Every other outcome shrinks in proportion.
// Set this back to {} to return to the normal odds in OUTCOMES above.
const ODDS_TEST={};
const WEIGHT=(()=>{
  const w=Object.fromEntries(Object.entries(OUTCOMES).map(([k,o])=>[k,o.w]));
  const rest=Object.keys(w).filter(k=>!(k in ODDS_TEST)).reduce((a,k)=>a+w[k],0),test=Object.values(ODDS_TEST).reduce((a,b)=>a+b,0);
  for(const k in ODDS_TEST)w[k]=Math.round(ODDS_TEST[k]*rest/(100-test));
  return w;
})();
const TOTAL_W=Object.values(WEIGHT).reduce((a,b)=>a+b,0);
const pct=w=>Math.round(w/TOTAL_W*1000)/10+'%';

function buildSlots(){
  let seed=20261028;
  const r=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const items=[];
  for(const k of Object.keys(OUTCOMES)){const off=r(),w=WEIGHT[k];for(let i=0;i<w;i++)items.push({k,pos:(i+off)/w+r()*1e-3})}
  return items.sort((a,b)=>a.pos-b.pos).map(x=>x.k);
}
const SLOTS=buildSlots();

const KOH_IDEAS=['down my whole drink','text my ex "I miss you"','do 20 push-ups','let the group post a story on my Instagram','drink a shot the group mixes','sing a song the group picks','call my mom and tell her I love her','wear my shirt inside out for the night','speak only in rhymes for 10 minutes','eat a spoon of mustard','let someone draw on my face'];
const RULE_IDEAS=['No saying "drink" — say "hydrate"','Drink with your left hand only','No first names','No pointing','Toast before every sip','Anyone who checks their phone drinks','End every sentence with "my liege"','No swearing','Talk about yourself in the third person'];
const ACCENTS=['French','West-Flemish','Antwerp','Dutch (from the Netherlands)','Scottish','Irish','Australian','Pirate','Posh British royal','Texan cowboy','Italian chef','Movie villain','Yoda','Sports commentator','Nature documentary narrator','Medieval knight','Robot','Valley girl'];

/* ---------- state ---------- */
const KEY='crazy-sips-v1';
const fresh=()=>({players:[],turn:0,bet:2,maxBet:5,cap:30,mercy:20,jackpot:5,rules:[],buddy:null,top:null,log:[],koh:[],started:false,muted:false,spins:0,nextId:1});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.players))S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=id=>S.players.find(p=>p.id===id);
const cur=()=>S.players[S.turn%S.players.length];
const others=p=>S.players.filter(q=>q.id!==p.id);
const randomOther=p=>pick(others(p));
const initial=p=>(p.name.trim()[0]||'?').toUpperCase();
const newPlayer=name=>({id:S.nextId++,name,drunk:0,given:0,hist:[],badges:{}});
function logIt(t){S.log.unshift({t,at:Date.now()});S.log=S.log.slice(0,80)}
function addSips(p,n){p.drunk+=n;p.hist.push([Date.now(),n]);if(p.hist.length>300)p.hist.shift()}
function drink(p,n,why){
  if(!p||n<=0)return '';
  addSips(p,n);let msg=`${p.name} drinks ${sips(n)}${why?` (${why})`:''}`;
  if(S.buddy&&S.buddy.includes(p.id)){const b=P(S.buddy.find(i=>i!==p.id));if(b){addSips(b,n);msg+=` + buddy ${b.name} drinks ${n}`}}
  logIt(msg);return msg;
}
function payout(raw,p,noCap){
  let t=raw;const notes=[];
  if(p.badges.ace){t*=2;notes.push('Ace doubles it')}
  if(!noCap&&t>S.cap){t=S.cap;notes.push(`capped at ${S.cap}`)}
  return{t,note:notes.join(', ')};
}
const recent=p=>p.hist.filter(h=>Date.now()-h[0]<30*60*1000).reduce((a,h)=>a+h[1],0);

/* ---------- sound ---------- */
let AC=null,lastTick=0;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function beep(f,d=.05,type='square',v=.05,when=0){
  if(S.muted)return;const a=ac();if(!a)return;
  try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
function tick(){const n=performance.now();if(n-lastTick<45)return;lastTick=n;beep(1500,.025,'square',.025)}
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>beep(f,.2,'triangle',.08,i*.11));
const doom=()=>[220,185,147,110].forEach((f,i)=>beep(f,.4,'sawtooth',.045,i*.28));

/* ---------- wheel ---------- */
class Wheel{
  constructor(canvas,slots,styleFn){this.c=canvas;this.slots=slots;this.styleFn=styleFn;this.rot=0;this.hl=null;this.resize()}
  resize(){const s=this.c.clientWidth||400,d=Math.min(window.devicePixelRatio||1,2);this.c.width=Math.round(s*d);this.c.height=Math.round(s*d);this.draw()}
  draw(){
    const c=this.c,x=c.getContext('2d'),W=c.width,R=W/2,n=this.slots.length,a=2*Math.PI/n;
    x.clearRect(0,0,W,W);x.save();x.translate(R,R);
    for(let i=0;i<n;i++){
      const st=this.styleFn(this.slots[i]),a0=-Math.PI/2+i*a,a1=a0+a;
      x.beginPath();x.moveTo(0,0);x.arc(0,0,R,a0,a1);x.closePath();x.fillStyle=st.bg;x.fill();
      x.strokeStyle='rgba(10,6,30,.55)';x.lineWidth=Math.max(1,W/600);x.stroke();
      if(this.hl&&this.slots[i]===this.hl){x.save();x.beginPath();x.arc(0,0,R*.975,a0+a*.08,a1-a*.08);x.lineWidth=R*.04;x.strokeStyle='#ffffff';x.stroke();x.restore()}
      x.save();x.rotate(a0+a/2);x.fillStyle=st.fg;x.textAlign='right';x.textBaseline='middle';
      const fs=st.big?Math.min(R*.11,a*R*.92):Math.min(R*.06,a*R*.66);
      x.font=st.big?`${fs}px Bungee, Impact, sans-serif`:`700 ${fs}px "Barlow Condensed", "Arial Narrow", sans-serif`;
      x.fillText(st.label,R*.93,0);x.restore();
    }
    x.beginPath();x.arc(0,0,R*.995,0,Math.PI*2);x.lineWidth=R*.012;x.strokeStyle='rgba(0,0,0,.5)';x.stroke();
    x.restore();
  }
  spinTo(idx,dur,onTick){
    return new Promise(res=>{
      const ad=360/this.slots.length,c=(idx+.15+Math.random()*.7)*ad,start=this.rot,mod=((start%360)+360)%360;
      let target=start-mod+360*(dur>2000?7:2)+((360-c)%360);if(target-start<360)target+=360;
      const t0=performance.now();let last=-1;
      const step=now=>{
        const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);
        this.rot=start+(target-start)*e;this.c.style.transform=`rotate(${this.rot}deg)`;
        const i=Math.floor((((-this.rot)%360+360)%360)/ad)%this.slots.length;
        if(i!==last){last=i;onTick&&onTick(this.slots[i])}
        if(p<1)requestAnimationFrame(step);else{this.rot=target%360;this.c.style.transform=`rotate(${this.rot}deg)`;res(this.slots[idx])}
      };requestAnimationFrame(step);
    });
  }
}

/* ---------- cards ---------- */
const SUITS=['♥','♦','♣','♠'];
const rankTxt=r=>({11:'J',12:'Q',13:'K',14:'A'})[r]||String(r);
const cardTxt=c=>rankTxt(c.r)+c.s;
const isRed=c=>c.s==='♥'||c.s==='♦';
function makeDeck(){const d=[];for(const s of SUITS)for(let r=2;r<=14;r++)d.push({r,s});return shuffle(d)}
const cardHTML=(c,anim,lg)=>`<div class="card ${isRed(c)?'red':''} ${anim?'flipin':''} ${lg?'lg':''}" aria-label="${rankTxt(c.r)} of ${c.s}"><span class="cr">${rankTxt(c.r)}${c.s}</span><span class="cs">${c.s}</span><span class="cr br">${rankTxt(c.r)}${c.s}</span></div>`;

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
function confetti(){
  if(reduced)return;const cv=$('#confetti'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#ffc83a','#ff3d8b','#2ad4ff','#3fe08f','#9a55ff','#ffffff'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:pick(cols),a:Math.random()*6}));
  const t0=performance.now();
  const f=now=>{x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(now-t0<2400)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)};requestAnimationFrame(f);
}
function flipCoin(el,front){
  return new Promise(r=>{const d=reduced?.4:1.8;el.style.transition=`transform ${d}s cubic-bezier(.2,.7,.2,1)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transform=`rotateY(${(reduced?1:6)*360+(front?0:180)}deg)`}));
    let n=0;const iv=reduced?null:setInterval(()=>{if(++n<10)beep(900+n*40,.03,'square',.02)},140);
    setTimeout(()=>{clearInterval(iv);beep(880,.15,'triangle',.08);r()},d*1000+60)});
}

/* give-out widget */
function giveUI(box,giver,raw,done,opts={}){
  const {t,note}=payout(raw,giver,opts.noCap);const os=others(giver);const alloc=Object.fromEntries(os.map(o=>[o.id,0]));
  if(os.length===1)alloc[os[0].id]=t;
  const used=()=>Object.values(alloc).reduce((a,b)=>a+b,0);
  const render=()=>{const left=t-used();
    box.innerHTML=`<div class="give"><div class="give-head"><span class="big-num">${t}</span><div><b>${esc(giver.name)} hands out ${t===1?'this sip':'these sips'}</b>${note?`<div class="muted small">${esc(note)}</div>`:''}<div class="muted small num">${left?`${left} left to hand out`:'All assigned'}</div></div></div>
    <div class="give-rows">${os.map(o=>`<div class="give-row"><span>${esc(o.name)}</span><div class="stepper"><button class="sbtn" data-m="${o.id}" aria-label="One less for ${esc(o.name)}">−</button><b>${alloc[o.id]}</b><button class="sbtn" data-p="${o.id}" aria-label="One more for ${esc(o.name)}">+</button></div></div>`).join('')}</div>
    <div class="row"><button class="btn ghost" data-a="rand">Random split</button><button class="btn ghost" data-a="even">Split evenly</button><button class="btn" data-a="done" ${left?'disabled':''}>Hand them out</button></div></div>`};
  box.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.p){if(used()<t)alloc[b.dataset.p]++}
    else if(b.dataset.m){if(alloc[b.dataset.m]>0)alloc[b.dataset.m]--}
    else if(b.dataset.a==='rand'){os.forEach(o=>alloc[o.id]=0);for(let i=0;i<t;i++)alloc[pick(os).id]++}
    else if(b.dataset.a==='even'){os.forEach(o=>alloc[o.id]=Math.floor(t/os.length));shuffle([...os]).slice(0,t%os.length).forEach(o=>alloc[o.id]++)}
    else if(b.dataset.a==='done'){giver.given+=t;const msgs=os.filter(o=>alloc[o.id]>0).map(o=>drink(o,alloc[o.id],`from ${giver.name}`));box.onclick=null;box.innerHTML='';done(msgs);return}
    render()};
  render();
}

/* modal */
const modal=$('#modal'),sheet=$('#sheet');
function openSheet(head,html,foot=''){sheet.innerHTML=head+`<div class="m-body">${html}</div>`+foot;modal.hidden=false;modal.scrollTop=0;return $('.m-body',sheet)}

function endRound(body,msgs=[],extra=''){
  const m=msgs.filter(Boolean);const d=document.createElement('div');d.className='result';
  d.innerHTML=`${extra}${m.length?`<ul class="drinks">${m.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<button class="btn wide pink" data-next>Next player →</button>`;
  body.appendChild(d);save();renderAll();
  $('[data-next]',d).onclick=nextTurn;
  const sk=$('.m-foot',sheet);if(sk)sk.remove();
  setTimeout(()=>d.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'}),50);
}

/* ---------- outcome resolvers ---------- */
const R={};
R.num=(b,ctx,key)=>{
  const n=OUTCOMES[key].n,raw=ctx.bet*n*ctx.mult;
  b.innerHTML=`<p class="lead">${esc(ctx.p.name)} bet ${sips(ctx.bet)} and hit <b>${n}</b>: ${ctx.bet} × ${n}${ctx.mult>1?` × ${ctx.mult} Top Slot`:''} = <b>${raw}</b>.</p><div class="gbox"></div>`;
  if(n>=10||ctx.mult>1)confetti();
  giveUI($('.gbox',b),ctx.p,raw,msgs=>endRound(b,msgs));
};
R.coin=(b,ctx)=>{

  const tot=rs.reduce((a,r)=>a+r.w,0);rs.forEach(r=>r.pct=r.w/tot);

    for(let i=0;i<=N;i++){const z=.04+i*stepLen-.11*stepLen;x.strokeStyle='#243242';x.lineWidth=Math.max(1.5,5*sc(z));x.beginPath();x.moveTo(W/2-(gx+pw+bw)*sc(z),py(z));x.lineTo(W/2+(gx+pw+bw)*sc(z),py(z));x.stroke()}

    // glass panels, far to near
    for(let i=N-1;i>=0;i--)for(const side of[-1,1]){
      const sp=steps[i],q=panel(i,side),s=sc(.04+i*stepLen);
      if(sp.broken===side){quad(q,null,'rgba(200,240,255,.16)',1);continue}
      const good=sp.known&&side===sp.safe,bad=sp.known&&side!==sp.safe;
      quad([q[0],q[1],[q[1][0],q[1][1]+5*s],[q[0][0],q[0][1]+5*s]],'rgba(120,200,240,.3)');
      quad(q,good?'rgba(63,224,143,.34)':bad?'rgba(255,75,92,.13)':'rgba(150,225,255,.2)',good?'rgba(120,255,190,.95)':bad?'rgba(255,120,130,.5)':'rgba(205,242,255,.8)',Math.max(1,1.6*s));
      x.save();x.beginPath();q.forEach(([a,c],k)=>k?x.lineTo(a,c):x.moveTo(a,c));x.clip();
      x.fillStyle='rgba(255,255,255,.16)';const w=q[1][0]-q[0][0];x.beginPath();x.moveTo(q[0][0]+w*.12,q[0][1]);x.lineTo(q[0][0]+w*.34,q[0][1]);x.lineTo(q[3][0]+w*.5,q[3][1]);x.lineTo(q[3][0]+w*.34,q[3][1]);x.fill();
      if(sp.glow>0&&good){x.fillStyle=`rgba(190,255,220,${sp.glow*.6})`;x.fillRect(0,0,W,H)}
      if(st.tense&&st.tense.i===i&&st.tense.side===side){x.fillStyle=`rgba(255,255,255,${.12+.12*Math.sin(now/38)})`;x.fillRect(0,0,W,H)}
      x.restore();
      if(bad){x.strokeStyle='rgba(255,120,130,.55)';x.lineWidth=Math.max(1,2*s);x.beginPath();x.moveTo(q[0][0],q[0][1]);x.lineTo(q[2][0],q[2][1]);x.moveTo(q[1][0],q[1][1]);x.lineTo(q[3][0],q[3][1]);x.stroke()}
      if(st.pick&&st.step===i)quad(q,null,`rgba(255,200,58,${.55+.45*Math.sin(now/140)})`,Math.max(2,3.2*s));
    }
    // falling glass
    for(let k=shards.length-1;k>=0;k--){const p=shards[k];p.life-=dt;if(p.life<=0||p.y>H+30){shards.splice(k,1);continue}p.vy+=640*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.min(1,p.life);x.fillStyle='rgba(190,235,255,.75)';x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=.8;x.beginPath();x.moveTo(-p.s*.5,p.s*.4);x.lineTo(p.s*.6,p.s*.2);x.lineTo(-p.s*.1,-p.s*.6);x.closePath();x.fill();x.stroke();x.restore()}

    quad(slab(-.1,-.004,-(gx+pw)*1.75,(gx+pw)*1.75),'#18212c','#3a5068',1.5);
    order.filter(a=>!a.gone).sort((p,q)=>q.z-p.z).forEach(a=>drawActor(a,now));
    x.restore();

    // HUD
    x.textBaseline='middle';
    if(st.tense){const v=x.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,Math.max(W,H)*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,W,H)}
    if(st.flash){x.fillStyle=`rgba(${st.flash.c},${st.flash.a})`;x.fillRect(0,0,W,H);st.flash.a-=dt*1.3;if(st.flash.a<=0)st.flash=null}
    x.font='13px Bungee, Impact, sans-serif';x.textAlign='left';tx(`STEP ${Math.min(st.step+1,N)}/${N}`,10,H*.13,'#7ff5e1',3);
    if(st.pick){
      const left=Math.max(0,PICK_MS-(now-st.pick.t0));
      x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,0,W,4);x.fillStyle=left<5000?'#ff4b5c':'#ffc83a';x.fillRect(0,0,W*left/PICK_MS,4);
      x.textAlign='right';tx(Math.ceil(left/1000)+' S',W-10,H*.13,left<5000?'#ff4b5c':'#ffc83a',3);
      x.textAlign='center';x.font=`${Math.max(13,Math.min(19,W/24))}px Bungee, Impact, sans-serif`;tx(name(st.pick.a)+': LEFT OR RIGHT?',W/2,H*.955,'#fff');
    }
    if(st.pop){st.pop.t+=dt;const p=st.pop,o=Math.max(0,1-p.t/1);x.globalAlpha=o;x.textAlign='center';x.font=`${Math.max(14,U*.42)}px Bungee, Impact, sans-serif`;tx(p.txt,p.x,p.y-p.t*26,p.c);x.globalAlpha=1;if(o<=0)st.pop=null}
    if(st.banner){const p=st.banner;p.t+=dt;const o=p.hold?1:Math.max(0,Math.min(1,(1.7-p.t)*2));x.globalAlpha=o;x.textAlign='center';x.font=`${Math.max(18,Math.min(36,W/13))}px Bungee, Impact, sans-serif`;tx(p.txt,W/2,H*.47,p.c,6);
      if(p.sub){x.font='700 15px "Barlow Condensed", sans-serif';tx(p.sub,W/2,H*.47+Math.max(22,W/26),'#fff',3)}x.globalAlpha=1;if(o<=0)st.banner=null}
    if(!stop||now<stop)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const choose=a=>new Promise(res=>{
    const L=$('[data-side="L"]',b),Rt=$('[data-side="R"]',b);
    st.pick={a,t0:performance.now(),done:side=>{if(!st.pick)return;st.pick=null;L.disabled=Rt.disabled=true;L.onclick=Rt.onclick=cv.onclick=null;res(side)}};
    L.disabled=Rt.disabled=false;L.onclick=()=>st.pick&&st.pick.done(-1);Rt.onclick=()=>st.pick&&st.pick.done(1);
    cv.onclick=e=>{const r=cv.getBoundingClientRect();st.pick&&st.pick.done(e.clientX-r.left<r.width/2?-1:1)};
  });
  async function cross(a){
    a.state='bridge';mark(a,'now');
    await hopTo(a,-.02,0,.3);
    for(let i=0;i<N;i++){
      const sp=steps[i];
      if(sp.known){beep(420,.04,'triangle',.04);await hopTo(a,zc(i),sp.safe,.24);continue}
      st.step=i;const side=await choose(a);
      beep(420,.05,'triangle',.05);await hopTo(a,zc(i),side,.42);beep(170,.08,'sine',.12);
      // the glass holds its breath: same wait whether it is about to hold or break
      const hold=reduced?.3:.8+Math.random()*.9;st.tense={i,side};
      for(let t=0,g=.2;t<hold-.05;t+=g,g=Math.max(.05,g*.82))beep(260+t*220,.04,'triangle',.05,t);
      await tween(hold,t=>{a.shiver=t});a.shiver=0;st.tense=null;sp.known=true;
      if(side===sp.safe){
        sp.glow=1;tween(.7,t=>{sp.glow=1-t});st.flash={c:'63,224,143',a:.3};st.pop={txt:'SAFE',x:px(side,zc(i)),y:py(zc(i))-U*sc(zc(i))*1.4,c:'#3fe08f',t:0};
        beep(784,.12,'triangle',.08);beep(1175,.22,'triangle',.08,.1);await wait(.45);continue;
      }
      sp.broken=side;shatter(i,side);st.flash={c:'255,75,92',a:.5};st.shake=1;
      a.state='fell';mark(a,'fell');fallMsgs.push(drink(a.pl,stake,`fell at step ${i+1} of the bridge`));
      st.banner={txt:name(a)+' FELL',sub:'DRINKS '+sips(stake).toUpperCase(),c:'#ff4b5c',t:0};
      await tween(1.1,t=>{a.drop=t*t;a.rot=t*1.5*side;a.alpha=1-t*t});
      a.gone=true;await wait(.7);return false;
    }
    st.step=N;await hopTo(a,1.08,exitSide(),.4);a.state='done';mark(a,'done');return true;
  }
  let finished=false;
  const finish=first=>{
    if(finished||!b.isConnected)return;finished=true;stop=performance.now()+2500;
    const ctl=$('.gb-ctl',b);if(ctl)ctl.remove();
    if(first){
      logIt(`${first.pl.name} crossed the glass bridge`);save();renderAll();
      giveUI($('.gbox',b),first.pl,stake*3,msgs=>endRound(b,[...fallMsgs,...msgs]));
    }else{
      logIt('Nobody crossed the glass bridge');
      endRound(b,fallMsgs,`<p class="verdict">The bridge wins</p><p class="lead" style="text-align:center">Nobody made it across.</p>`);
    }
  };
  $('[data-go]',b).onclick=()=>{
    ac();const foot=$('.m-foot',sheet);if(foot)foot.remove();
    $('.gb-ctl',b).innerHTML='<button class="btn cyan" data-side="L" disabled>◀ Left</button><button class="btn pink" data-side="R" disabled>Right ▶</button>';
    cv.scrollIntoView({block:'center'});
    (async()=>{
      let first=null;
      for(const a of order){if(await cross(a)){first=a;break}}
      if(first){
        fanfare();confetti();st.banner={txt:name(first)+' MADE IT',sub:'HANDS OUT '+sips(stake*3).toUpperCase(),c:'#ffc83a',t:0,hold:true};
        // everyone still waiting knows the way and walks across
        await Promise.all(order.filter(a=>a.state==='wait').map(async(a,k)=>{
          a.state='bridge';await wait(.3+k*.24);await hopTo(a,-.02,0,.2);
          for(let i=0;i<N;i++)await hopTo(a,zc(i),steps[i].safe,.15);
          await hopTo(a,1.08,exitSide(),.2);a.state='done';mark(a,'done');
        }));
        await wait(.5);
      }else{doom();st.banner={txt:'THE BRIDGE WINS',c:'#ff4b5c',t:0,hold:true};await wait(1.3)}
      finish(first);
    })().catch(()=>finish(null));
  };
};

R.miss=(b,ctx)=>{doom();b.innerHTML=`<p class="lead">The house wins. ${esc(ctx.p.name)} drank ${sips(ctx.bet)} for nothing.</p>`;endRound(b,[])};

function resolve(key,ctx){
  const o=OUTCOMES[key],st=style(key);
  const head=`<div class="m-head" style="--c:${st.bg};--cf:${st.fg}"><span class="m-kind">${KIND[o.kind]} · ${pct(WEIGHT[key])} · ${esc(ctx.p.name)}</span><h2>${o.kind==='num'?`× ${o.n}`:esc(o.name)}</h2>${ctx.mult>1?`<span class="ts-hit">TOP SLOT ×${ctx.mult}</span>`:''}</div>`;
  const body=openSheet(head,'',`<div class="m-foot"><button class="linkbtn" data-skip>Skip this round</button></div>`);
  $('[data-skip]',sheet).onclick=()=>{logIt(`${ctx.p.name}'s ${oname(key)} was skipped`);nextTurn()};
  (o.kind==='num'?R.num:R[key])(body,ctx,key);
}

/* ---------- turn flow ---------- */
let wheel,spinning=false;
function newTop(){S.top={key:pick(TOP_KEYS),mult:pick([2,2,2,3,3,5])}}
async function spin(){
  if(spinning||S.players.length<2)return;ac();spinning=true;const p=cur(),bet=Math.min(S.bet,S.maxBet);
  if(p.badges.accent){logIt(`${p.name}'s ${p.badges.accent} accent is lifted`);delete p.badges.accent}
  toast(drink(p,bet,'bet'));S.spins++;save();renderAll();
  hostPull();hostSay(pick(HOST_LINES.spin),'smile',1800);
  const idx=rnd(SLOTS.length),key=SLOTS[idx];
  await wheel.spinTo(idx,reduced?1200:5600,tick);
  const mult=S.top&&S.top.key===key?S.top.mult:1;
  logIt(`${p.name} spun ${oname(key)}${mult>1?` with Top Slot ×${mult}`:''}`);
  if(mult>1)fanfare();
  // a beat to see where it landed, and the host's reaction, before the outcome screen
  hostReact(key,mult);await new Promise(r=>setTimeout(r,reduced?350:1200));
  spinning=false;resolve(key,{p,bet,mult});
}
function nextTurn(){
  closeModal();S.turn=(S.turn+1)%S.players.length;
  if(S.turn===0){S.jackpot++;logIt(`Round complete, the jackpot grows to ${sips(S.jackpot)}`)}
  S.players.forEach(q=>{if(q.badges.ace&&--q.badges.ace<=0){delete q.badges.ace;logIt(`${q.name} is no longer the Ace`)}});
  newTop();save();renderAll();wheel.hl=S.top.key;wheel.draw();
  hostSay(pick(HOST_LINES.turn)(cur().name),'smile',2400);
}

      const ci=S.players.findIndex(p=>p.id===curId);S.turn=ci>=0?ci:0;
      const num=(id,lo,hi,d)=>{const v=parseInt($(id,box).value,10);return isNaN(v)?d:Math.max(lo,Math.min(hi,v))};
      S.maxBet=num('#sMax',1,20,5);S.cap=num('#sCap',5,200,30);S.mercy=num('#sMercy',5,100,20);S.bet=Math.min(S.bet,S.maxBet);
      if(!S.started){S.started=true;logIt(`Game on with ${S.players.map(p=>p.name).join(', ')}`)}
      if(!S.top)newTop();save();show();};
    const rb=$('#resetBtn',box);if(rb)rb.onclick=()=>{if(!confirmReset){confirmReset=true;draw();return}const m=S.muted;S=fresh();S.muted=m;save();show()};
  };draw();
}
function show(){
  const setup=!S.started||S.players.length<2||showSettings;
  $('#setup').hidden=!setup;$('#game').hidden=setup;$('#setBtn').hidden=setup;$('#statsBtn').hidden=setup;
  if(setup){renderSetup();return}
  if(!wheel){wheel=new Wheel($('#wheel'),SLOTS,style);renderOdds()}else wheel.resize();
  wheel.hl=S.top&&S.top.key;wheel.draw();renderAll();
}
let showSettings=false;
$('#setBtn').onclick=()=>{showSettings=true;show();showSettings=false};
$('#muteBtn').onclick=()=>{S.muted=!S.muted;save();if(!S.muted)beep(880,.08,'triangle',.06);renderAll()};

$('#statsBtn').onclick=()=>{
  const s=[...S.players].sort((a,b)=>b.drunk-a.drunk);
  const byGiven=[...S.players].sort((a,b)=>b.given-a.given)[0];
  const victims={};S.koh.forEach(k=>victims[k.name]=(victims[k.name]||0)+1);
  const head=`<div class="m-head" style="--c:#000;--cf:#ffc83a"><span class="m-kind">After ${S.spins} ${S.spins===1?'spin':'spins'}</span><h2>Scoreboard</h2></div>`;
  const body=openSheet(head,`
    <div class="awards"><div class="award"><span class="eyebrow">Most punished</span><b>${esc(s[0].name)}</b><span class="muted small">${sips(s[0].drunk)} drunk</span></div>
    <div class="award"><span class="eyebrow">Most generous</span><b>${esc(byGiven.name)}</b><span class="muted small">${sips(byGiven.given)} handed out</span></div>
    <div class="award"><span class="eyebrow">Jackpot</span><b>${sips(S.jackpot)}</b><span class="muted small">waiting to be won</span></div></div>
    <div style="overflow-x:auto"><table class="score"><thead><tr><th>Player</th><th class="n">Drunk</th><th class="n">Given</th><th class="n">K♥ pulls</th></tr></thead><tbody>${s.map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${p.drunk}</td><td class="n">${p.given}</td><td class="n">${victims[p.name]||0}</td></tr>`).join('')}</tbody></table></div>
    <div><span class="eyebrow">King of Hearts victims</span>${S.koh.length?`<ul class="drinks" style="margin-top:8px">${S.koh.map(k=>`<li><b>${esc(k.name)}</b> · ${new Date(k.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</li>`).join('')}</ul>`:'<p class="empty" style="margin-top:6px">Nobody has met the King yet.</p>'}</div>
    <button class="btn wide" data-close>Back to the wheel</button>`);
  $('[data-close]',body).onclick=closeModal;
};
modal.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('[data-close]',sheet))closeModal()});

let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(wheel&&!spinning)wheel.resize()},150)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(wheel)wheel.draw()});
if(S.started&&!S.top)newTop();
show();
</script>

<script>
/* PWA: offline service worker, install button, keep the screen awake */
(()=>{
  if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

  let lock=null;
  const wake=async()=>{try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch(e){}};
  document.addEventListener('click',wake,{once:true});
  document.addEventListener('visibilitychange',wake);

  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone)return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const btn=document.createElement('button');btn.className='btn sm';btn.textContent='Install app';btn.hidden=!ios;
  document.querySelector('.top-actions').prepend(btn);
  let deferred=null;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btn.hidden=false});
  addEventListener('appinstalled',()=>{btn.hidden=true;deferred=null});
  btn.onclick=async()=>{
    if(deferred){deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;btn.hidden=true;return}
    const body=openSheet('<div class="m-head" style="--c:#000;--cf:#ffc83a"><span class="m-kind">iPhone &amp; iPad</span><h2>Install Crazy Sips</h2></div>',
      '<ol class="drinks" style="list-style:decimal;padding-left:22px"><li>Tap the <b>Share</b> button (the square with the arrow pointing up).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>. Crazy Sips now opens full screen from your home screen and works offline.</li></ol><button class="btn wide" data-close>Got it</button>');
    body.querySelector('[data-close]').onclick=closeModal;
  };
})();
</script>
